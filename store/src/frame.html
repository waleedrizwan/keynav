<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        background: linear-gradient(160deg, #2d2f48, #121320);
        font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h2 {
        margin: 30px 0 6px;
        font-size: 38px;
        letter-spacing: -0.6px;
      }
      h2 em {
        font-style: normal;
        color: #ffd84d;
      }
      p {
        margin: 0 0 22px;
        font-size: 18px;
        color: #c4c7dc;
      }
      kbd {
        display: inline-block;
        min-width: 1.1em;
        padding: 0.05em 0.35em;
        border-radius: 0.2em;
        background: #ffd84d;
        color: #1a1a1a;
        font:
          700 0.8em ui-monospace,
          Menlo,
          monospace;
        text-align: center;
        box-shadow: 0 0.1em 0 #b89400;
        vertical-align: 0.08em;
      }
      img {
        width: 1000px;
        border-radius: 12px;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <h2 id="title"></h2>
    <p id="sub"></p>
    <img id="shot" />
  </body>
</html>
