<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      body {
        background: linear-gradient(160deg, #2d2f48, #121320);
        font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--gap);
        width: var(--w);
        height: var(--h);
      }
      img {
        width: var(--icon);
        height: var(--icon);
      }
      h1 {
        margin: 0;
        font-size: var(--title);
        letter-spacing: -1px;
      }
      p {
        margin: 6px 0 0;
        font-size: var(--tag);
        color: #c4c7dc;
        line-height: 1.3;
      }
      .keys {
        margin-top: 14px;
        display: flex;
        gap: 8px;
      }
      kbd {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 6px;
        background: #ffd84d;
        color: #1a1a1a;
        font:
          700 var(--kbd) ui-monospace,
          Menlo,
          monospace;
        box-shadow: 0 2px 0 #b89400;
      }
      kbd.ring {
        background: transparent;
        color: #ff3b7f;
        box-shadow: inset 0 0 0 2px #ff3b7f;
      }
    </style>
  </head>
  <body>
    <img id="icon" />
    <div>
      <h1>Keynav</h1>
      <p id="tag"></p>
      <div class="keys"><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd><kbd class="ring">;</kbd></div>
    </div>
  </body>
</html>
